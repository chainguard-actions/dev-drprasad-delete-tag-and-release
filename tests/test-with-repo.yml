name: Test with repo input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.0-test-nonexistent
          delete_release: true
          repo: octocat/Hello-World
        env:
          GITHUB_TOKEN: fake-token
      - name: Assert action ran with repo input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the tag/token is not real,
          # but we verify it ran (not skipped) and the repo input was accepted.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with tag_name and repo inputs"
